[build-system]
requires = ["hatchling>=1.18"]
build-backend = "hatchling.build"

[project]
name = "email-deliverability-suite"
version = "0.1.0"
description = "deliv: a tested CLI suite for email deliverability audits, pre-send QA, DNS authentication checks, and spam scoring."
readme = "README.md"
license = "MIT"
license-files = ["LICENSE"]
requires-python = ">=3.10"
authors = [{ name = "Andrew Luxem" }]
keywords = [
  "email",
  "deliverability",
  "spf",
  "dkim",
  "dmarc",
  "bimi",
  "mta-sts",
  "dnsbl",
  "spam",
  "cli",
  "lifecycle-marketing",
]
classifiers = [
  "Development Status :: 4 - Beta",
  "Environment :: Console",
  "Intended Audience :: Developers",
  "Intended Audience :: Information Technology",
  "Operating System :: OS Independent",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.10",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Topic :: Communications :: Email",
  "Topic :: Internet :: Name Service (DNS)",
]
dependencies = [
  "typer>=0.12",
  "dnspython>=2.4",
]

[project.optional-dependencies]
dev = [
  "pytest>=8.0",
  "ruff>=0.5",
]

[project.scripts]
deliv = "deliv.cli:main"

[project.urls]
Homepage = "https://github.com/andrewluxem/email-deliverability-suite"
Issues = "https://github.com/andrewluxem/email-deliverability-suite/issues"

[tool.hatch.build.targets.wheel]
packages = ["src/deliv"]

[tool.hatch.build.targets.wheel.force-include]
"data/spam_triggers.json" = "deliv/data/spam_triggers.json"

[tool.hatch.build.targets.sdist]
include = ["src/deliv", "data", "tests", "skills", "README.md", "LICENSE"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra"

[tool.ruff]
line-length = 100
target-version = "py310"
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "SIM", "RUF", "D"]
ignore = [
  "D105", # magic methods do not need docstrings
  "D107", # __init__ is documented on the class
]

[tool.ruff.lint.pydocstyle]
convention = "google"

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["D"]
